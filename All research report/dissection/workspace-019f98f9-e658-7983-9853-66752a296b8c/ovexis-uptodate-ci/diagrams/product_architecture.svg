<rect x="620" y="126" width="170" height="66" rx="6" fill="#fff" stroke="#7fb2e5"/><text x="630" y="150" font-weight="bold">Abridge (partner)</text><text x="630" y="168">ambient documentation CDS</text>
<rect x="810" y="126" width="180" height="66" rx="6" fill="#fff" stroke="#7fb2e5"/><text x="820" y="150" font-weight="bold">Expert AI Chat UI</text><text x="820" y="168">app + enterprise surfaces</text>
<rect x="1010" y="126" width="180" height="66" rx="6" fill="#fff" stroke="#7fb2e5"/><text x="1020" y="150" font-weight="bold">Store / Account</text><text x="1020" y="168">Salesforce B2B Commerce</text>
