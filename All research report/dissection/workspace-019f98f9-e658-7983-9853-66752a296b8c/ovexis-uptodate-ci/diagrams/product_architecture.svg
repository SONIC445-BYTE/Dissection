<!-- ABSENCES -->
<rect x="30" y="640" width="1180" height="120" rx="10" fill="#fdeaea" stroke="#e77"/>
<text x="50" y="666" font-size="14" font-weight="bold" fill="#a02020">ARCHITECTURALLY ABSENT (verified negative space)</text>
<g font-size="12.5" fill="#7a1f1f">
<text x="50" y="694">✗ Patient identity / MPI layer      ✗ FHIR/CCDA ingestion      ✗ Wearables &amp; labs intake      ✗ Persistent patient memory / digital twin</text>
<text x="50" y="720">✗ Care plans &amp; care-team messaging      ✗ Public API / SDK / webhooks      ✗ Consent primitives (patient-side)      ✗ Referral routing</text>
</g>
<rect x="30" y="780" width="1180" height="76" rx="10" fill="#eef3f9" stroke="#9dc3ea"/>
<text x="50" y="806" font-size="13" font-weight="bold" fill="#1b4f8a">KEY STRUCTURAL FACT</text>
<text x="50" y="830" font-size="12.5" fill="#33475b">UpToDate is a star-topology around its corpus: every product surface reads from graded content; PHI/transient chart context enters only as query parameters (Infobutton) and is never persisted.</text>
<text x="50" y="848" font-size="12.5" fill="#33475b">The 2025–26 GenAI platform wraps the same corpus in an agent — extending the star, not changing its topology. Source: WK job post R0052281 + integration docs.</text>
</svg>
