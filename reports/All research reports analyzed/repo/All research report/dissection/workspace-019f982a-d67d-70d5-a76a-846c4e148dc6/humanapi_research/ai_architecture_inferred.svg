<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4B5563"/></marker></defs><rect width="1400" height="760" fill="#F8FAFC"/><text x="700" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800">Inferred Analytics / AI Architecture</text><text x="700" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#4B5563">No public evidence of a consumer LLM chatbot; confirmed analytics include parsing, normalization, summaries, Medical Insights and mortality predictors.</text><rect x="80" y="140" width="230" height="85" rx="14" fill="#fff" stroke="#111827" stroke-width="1.4"/><text x="195.0" y="165" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Records + APS</text><text x="195.0" y="187" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">EHR/CCD/PDF/labs</text><rect x="380" y="140" width="230" height="85" rx="14" fill="#FEE2E2" stroke="#111827" stroke-width="1.4"/><text x="495.0" y="165" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Parsing/OCR/NLP</text><text x="495.0" y="187" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Confirmed parsing; exact models unknown</text><rect x="680" y="140" width="230" height="85" rx="14" fill="#FFEDD5" stroke="#111827" stroke-width="1.4"/><text x="795.0" y="165" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Normalization</text><text x="795.0" y="187" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Codes, units, dedupe, timelines</text><rect x="980" y="140" width="230" height="85" rx="14" fill="#E0F2FE" stroke="#111827" stroke-width="1.4"/><text x="1095.0" y="165" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Feature Extraction</text><text x="1095.0" y="187" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Vitals, labs, impairments, social hx</text><rect x="230" y="360" width="230" height="85" rx="14" fill="#EDE9FE" stroke="#111827" stroke-width="1.4"/><text x="345.0" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Rules/Guidelines</text><text x="345.0" y="407" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Sufficiency, order type, APS delay</text><rect x="530" y="360" width="230" height="85" rx="14" fill="#FCE7F3" stroke="#111827" stroke-width="1.4"/><text x="645.0" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Summary Generation</text><text x="645.0" y="407" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Highlights, Clinical History, APS summary</text><rect x="830" y="360" width="230" height="85" rx="14" fill="#DCFCE7" stroke="#111827" stroke-width="1.4"/><text x="945.0" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Risk/Decision Inputs</text><text x="945.0" y="407" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Mortality predictors, underwriting attrs</text><rect x="1130" y="360" width="210" height="85" rx="14" fill="#fff" stroke="#111827" stroke-width="1.4"/><text x="1235.0" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Human Review</text><text x="1235.0" y="407" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Underwriter/case manager</text><rect x="530" y="580" width="280" height="85" rx="14" fill="#F3F4F6" stroke="#111827" stroke-width="1.4"/><text x="670.0" y="605" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Evaluation + QA</text><text x="670.0" y="627" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">Audit logs, request IDs, support triage</text><line x1="310" y1="182" x2="380" y2="182" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="610" y1="182" x2="680" y2="182" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="910" y1="182" x2="980" y2="182" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="1095" y1="225" x2="345" y2="360" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><text x="720.0" y="286.5" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">features</text><line x1="795" y1="225" x2="645" y2="360" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><text x="720.0" y="286.5" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">summarize</text><line x1="1095" y1="225" x2="945" y2="360" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><text x="1020.0" y="286.5" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">risk attrs</text><line x1="1060" y1="402" x2="1130" y2="402" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="645" y1="445" x2="670" y2="580" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><text x="657.5" y="506.5" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">monitor</text><line x1="945" y1="445" x2="670" y2="580" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/><text x="807.5" y="506.5" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">monitor</text></svg>