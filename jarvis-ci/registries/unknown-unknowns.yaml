# Unknown Unknown Discovery — Module 11
# A PERMANENT research function, not a Phase Omega afterthought.
# Auto-generated by evolve.py triggers; curated by humans.

meta:
  version: 1.0.0
  updated: 2026-07-26
  probe_classes: [hidden-assumptions, architectural-blind-spots,
                  distribution-blind-spots, regulatory-blind-spots,
                  organisational-bottlenecks, missing-integrations,
                  emerging-competitors, adjacent-markets,
                  new-ecosystem-layers, future-technologies]

auto_triggers:
  - {name: capability-zero-implementations, fires_when: "capability has 0 implementations", produces: negative-space-probe}
  - {name: pattern-single-instance, fires_when: "pattern at 1 instance after 10 dossiers", produces: is-this-real-probe}
  - {name: layer-no-competitor, fires_when: "layer has 0 Direct Competitors after full coverage", produces: uncontested-layer-probe}
  - {name: shared-assumption, fires_when: ">=3 dossiers share an unexamined assumption", produces: hidden-assumption-probe}
  - {name: empty-field, fires_when: "registry field empty across >80% of entries", produces: are-we-asking-probe}

probes:

  - id: UNK-001
    probe_class: hidden-assumptions
    question: "Every company registered in L3 assumes memory is worth persisting. What if the correct architecture for clinical work is aggressive forgetting with cheap re-derivation from the system of record — which is authoritative anyway?"
    surfaced_by: pattern-absence
    surfaced_in: [Mem0]
    status: open
    priority: high
    would_invalidate: [PRIN-003, DEC-001]
    rationale: "In healthcare the EMR is the source of truth. A memory layer that duplicates it inherits staleness AND consent obligations for data it did not need to hold."

  - id: UNK-002
    probe_class: regulatory-blind-spots
    question: "If DPDP enforcement matures to GDPR levels, does an LLM-extraction memory pipeline become legally unusable for clinical data regardless of residency?"
    surfaced_by: auto-trigger:capability-zero-implementations
    surfaced_in: [Mem0]
    status: open
    priority: high
    would_invalidate: [DEC-001, DEC-004]

  - id: UNK-003
    probe_class: new-ecosystem-layers
    question: "MCP consolidated the agent-to-tool layer in ~16 months and erased bespoke integration advantage. Which layer is next to be standardised — and is JARVIS building differentiation in it right now?"
    surfaced_by: manual
    status: open
    priority: high
    would_invalidate: [PRIN-002]
    rationale: "Standards waves erase whole classes of differentiation faster than roadmaps can react. Memory and adapter interfaces are both plausible next targets."

  - id: UNK-004
    probe_class: organisational-bottlenecks
    question: "The research pipeline requires 107 more fresh-context dossier runs. Is that throughput actually available, and if not, what does a correct 30-dossier subset look like?"
    surfaced_by: manual
    status: open
    priority: critical
    rationale: "A research plan that cannot be executed produces a permanently locked synthesis gate. Better to scope honestly than to stall at 40%."

  - id: UNK-005
    probe_class: adjacent-markets
    question: "Indian tier-2/3 clinics are the stated market. Is the actual buyer the clinic, the hospital chain, the diagnostic lab, or the insurer — and does the product differ per buyer?"
    surfaced_by: auto-trigger:empty-field
    status: open
    priority: high
    rationale: "Baseline Q5 remains unanswered. It materially affects D9/D10 across all 107 remaining dossiers."
